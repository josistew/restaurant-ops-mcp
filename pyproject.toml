[project]
name = "restaurant-ops-mcp"
version = "0.1.0"
description = "MCP server that gives AI agents eyes on restaurant operating data: menu margins, vendor price history, catering orders, and nutrition."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Josiah Stewart" }]
keywords = ["mcp", "restaurant", "food-cost", "margin", "model-context-protocol"]
dependencies = ["mcp>=2.0"]

[project.scripts]
restaurant-ops-mcp = "restaurant_ops_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/restaurant_ops_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
